<!-- 
  GIS Map Page
  Displays property locations on an interactive map using Leaflet
  Shows markers for paid (green) and unpaid (red) properties
  Clicking a marker shows property details in a popup
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIS Map | Hargeisa Property Tax</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Leaflet CSS library for interactive map display -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <h2>Hargeisa Property Tax</h2>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="properties.html">Properties</a>
          <a href="tax.html">Tax Management</a>
          <a href="map.html" class="active">GIS Map</a>
          <a href="reports.html">Reports</a>
          <a href="#" id="logoutBtn">Logout</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1>GIS Map</h1>
        </header>

        <section class="card map-card">
          <div id="map"></div>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/map.js"></script>
  </body>
</html>
